repos:

-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

-   repo: https://github.com/ambv/black
    rev: 26.1.0
    hooks:
      - id: black

-   repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - &mypy_base
        id: mypy
        name: mypy (float32)
        exclude: examples|docs
        additional_dependencies:
          - "qoolqit[extras]>=1.3.0" # The version in pyproject.toml must match
          - "jaxtyping"
        args: [--always-false=_USE_DOUBLE_PRECISION, --cache-dir=.mypy_cache_f32]

      - <<: *mypy_base
        name: mypy (float64)
        args: [--always-true=_USE_DOUBLE_PRECISION, --cache-dir=.mypy_cache_f64]

# Cleanup jupyter notebooks
-   repo: https://github.com/srstevenson/nb-clean
    rev: 4.0.1
    hooks:
      - id: nb-clean
        args:
          - --remove-empty-cells
          - --preserve-cell-outputs
