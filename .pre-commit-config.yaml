repos:

-   repo: https://github.com/betterleaks/betterleaks
    rev: 5eab48332cc48565864514e3bc6de89df091a7c4 # frozen: v1.8.1
    hooks:
      - id: betterleaks

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

-   repo: https://github.com/ambv/black
    rev: 87928e6d6761a4a6d22250e1fee5601b3998086e # frozen: 26.5.1
    hooks:
      - id: black

-   repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: fa93bc3224c614a0e9786d3e2d3d48edcca246eb # frozen: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]

-   repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # frozen: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee # frozen: v2.3.1
    hooks:
      - &mypy_base
        id: mypy
        name: mypy (float32)
        exclude: examples|docs
        additional_dependencies:
          - "qoolqit[extras]>=1.4.0" # The version in pyproject.toml must match
          - "jaxtyping"
        args: [--always-false=_USE_DOUBLE_PRECISION, --cache-dir=.mypy_cache_f32]

      - <<: *mypy_base
        name: mypy (float64)
        args: [--always-true=_USE_DOUBLE_PRECISION, --cache-dir=.mypy_cache_f64]

-   repo: https://github.com/osprey-oss/deptry.git
    rev: 0c39226d761685125c5ff71ca81282d6751c9540 # frozen: 0.25.1
    hooks:
      - id: deptry

# Cleanup jupyter notebooks
-   repo: https://github.com/srstevenson/nb-clean
    rev: f745b986570ef12cfbe0cfe20a7e0271c328914f # frozen: 4.0.1
    hooks:
      - id: nb-clean
        args:
          - --remove-empty-cells
          - --preserve-cell-outputs
