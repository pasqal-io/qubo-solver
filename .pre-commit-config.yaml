repos:

-   repo: https://github.com/betterleaks/betterleaks
    rev: 81aff7a638638aae3a659845d089043e1d8fe9ac # frozen: v1.9.0
    hooks:
      - id: betterleaks

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-added-large-files

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

-   repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # frozen: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

# Runs mypy from the project venv (`uv run`), so it checks against the real
# dependencies and needs no separate hook environment.
-   repo: local
    hooks:
      - &mypy_base
        id: mypy
        name: mypy (float32)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        exclude: examples|docs
        require_serial: true
        args: [--always-false=_USE_DOUBLE_PRECISION, --cache-dir=.mypy_cache_f32]

      - <<: *mypy_base
        name: mypy (float64)
        args: [--always-true=_USE_DOUBLE_PRECISION, --cache-dir=.mypy_cache_f64]

-   repo: https://github.com/osprey-oss/deptry.git
    rev: 0c39226d761685125c5ff71ca81282d6751c9540 # frozen: 0.25.1
    hooks:
      - id: deptry
        # deptry must run inside the project venv to read the installed
        # dependencies' metadata; plain `git commit` doesn't have it on PATH.
        entry: uv run deptry .

# Cleanup jupyter notebooks
-   repo: https://github.com/srstevenson/nb-clean
    rev: f745b986570ef12cfbe0cfe20a7e0271c328914f # frozen: 4.0.1
    hooks:
      - id: nb-clean
        args:
          - --remove-empty-cells
          - --preserve-cell-outputs

# Static analysis of GitHub Actions workflows
-   repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
