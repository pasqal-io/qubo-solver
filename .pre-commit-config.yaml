repos:

-   repo: https://github.com/betterleaks/betterleaks
    rev: 39d5bdcf34db54e944facac5cf6e8b03db5e2b99 # frozen: v1.10.1
    hooks:
      # Scans the commits of the current branch that are not in origin/main.
      # Skipped in the Lint workflow (shallow clone); the Secret Detection workflow scans the full history.
      - id: betterleaks
        alias: betterleaks-branch
        name: Detect hardcoded secrets (branch)
        entry: betterleaks git --redact
        # --config: since v1.10.0, betterleaks no longer auto-loads it
        args: [--config=.betterleaks.toml, --log-opts=origin/main..HEAD]

      # Scans the current contents of the given files, unstaged edits included.
      # Whole repo: `prek run betterleaks-files --all-files`
      - id: betterleaks
        alias: betterleaks-files
        name: Detect hardcoded secrets (file contents)
        entry: betterleaks dir --redact
        args: [--config=.betterleaks.toml]
        pass_filenames: true

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-added-large-files
        exclude: ^uv\.lock$  # ~1 MB, generated by uv

# Runs ruff, mypy, bandit, deptry and nb-clean from the project venv (`uv run`): their only
# version pin is uv.lock (shared with CI), and they need no separate hook
# environment. `--locked` makes `uv run` fail instead of silently updating uv.lock.
-   repo: local
    hooks:
      - id: uv-lock
        name: uv.lock in sync with pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      # Same ruff as the docs build, which formats the API signatures with it.
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - &mypy_base
        id: mypy
        name: mypy (float32)
        entry: uv run --locked mypy
        language: system
        types_or: [python, pyi]
        exclude: examples|docs
        require_serial: true
        args: [--always-false=_USE_DOUBLE_PRECISION, --cache-dir=.mypy_cache_f32]

      - <<: *mypy_base
        name: mypy (float64)
        args: [--always-true=_USE_DOUBLE_PRECISION, --cache-dir=.mypy_cache_f64]

      - id: bandit
        name: bandit
        entry: uv run --locked bandit
        language: system
        types: [python]
        require_serial: true
        args: [-c, pyproject.toml]

      - id: deptry
        name: deptry
        # deptry must run inside the project venv to read the installed
        # dependencies' metadata; plain `git commit` doesn't have it on PATH.
        entry: uv run --locked deptry .
        language: system
        always_run: true
        pass_filenames: false

      # Cleanup jupyter notebooks. Installed from the prebuilt PyPI wheel: the
      # upstream hook (`language: rust`) compiles it and needs a Rust toolchain.
      - id: nb-clean
        name: nb-clean
        entry: uv run --locked nb-clean clean
        language: system
        types_or: [jupyter]
        args: [--remove-empty-cells, --preserve-cell-outputs]


# Static analysis of GitHub Actions workflows
-   repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
