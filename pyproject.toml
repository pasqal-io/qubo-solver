[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qubo-solver"
description = "A Quadratic Unconstrained Binary Optimization (QUBO) solver library using quantum and classical approaches."
readme = "README.md"
version = "0.9.1"
requires-python = ">=3.11,<3.15"
license = { text = "Pasqal Open-Source Software License 2026 (MIT-derived)" }
keywords = ["quantum", "qubo", "solver", "optimization", "combinatorial"]
authors = [
  { name = "Antoine Bussy", email = "antoine.bussy@pasqal.com" },
  { name = "Monique Garzillo", email = "monique.garzillo@pasqal.com" },
  { name = "Manu Lahariya" },
  { name = "Quentin Ma", email = "quentin.ma@pasqal.com" },
  { name = "Charles Moussa" },
  { name = "Yassine Naghmouchi", email = "yassine.naghmouchi@pasqal.com" },
  { name = "Wesley da Silva Coelho", email = "wesley.coelho@pasqal.com" },
  { name = "Clément de Terrasson de Montleau", email = "clement.de-terrasson@pasqal.com" },
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: OS Independent",
]

# always specify a version for each package
# to maintain consistency
dependencies = [
  "numpy>=2",
  "torch",
  "scikit-learn",
  "pandas",
  "seaborn",
  "scikit-optimize",
  "swiglpk>=5.0.13",
  "qoolqit[extras]>=1.5.0", # The version in .pre-commit-config.yaml must match
  "shapely",
  "scipy",
  "pasqal-cloud",
  "pulser[torch]>=1.9.0",
  "emu-mps",
  "emu-sv",
]

[project.optional-dependencies]
extras = [
  "cplex",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-check",
  "pytest-cov",
  "pytest-xdist",
  "pytest-asyncio",
  "pytest-rerunfailures",
  "nbconvert",
  "ipykernel",
  "jupyter",
  "ipython",
  "matplotlib",
  "tqdm",
  "mypy",
  "jaxtyping",
  "beartype>=0.23",
  "typing_extensions",
  "bandit[sarif,toml]>=1.9.4",
  "deptry",
  "prek",
]
doc = [
  "properdocs",
  "mkdocs-material",
  "mkdocstrings",
  "mkdocstrings-python",
  "mkdocs-section-index",
  "mkdocs-exclude",
  "mkdocs-jupyter",
  "markdown-exec",
  "mkdocs-macros-plugin",
  "mike",
  "python-markdown-math",
]
# torch wheel selection (uv only, see [tool.uv.sources]):
# plain `uv sync` installs the default PyPI wheels (CUDA on Linux), `uv sync --group cpu`
# the CPU-only wheels.
cpu = [
  "torch",
]
# Same as plain `uv sync`; needed so uv can declare it as conflicting with `cpu`.
cuda = [
  "torch",
]

[tool.uv]
default-groups = ["dev", "doc"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.urls]
Documentation = "https://pasqal-io.github.io/qubo-solver/latest/"
Issues = "https://github.com/pasqal-io/qubo-solver/issues"
Source = "https://github.com/pasqal-io/qubo-solver"


# hatchling build backend config (not the hatch CLI, which this project doesn't use)
[tool.hatch.metadata]
allow-direct-references = true
allow-ambiguous-features = true

[tool.hatch.build.targets.sdist]
exclude = [
    "/.gitignore",
    "/.pre-commit-config.yml",
    "/tests",
    "/docs",
    "/examples",
]

[tool.hatch.build.targets.wheel]
packages = ["qubosolver"]

[tool.pytest]
testpaths = ["tests"]
addopts = [
    "-n=auto",
    "-vvv",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-config=pyproject.toml",
    "--cov=qubosolver",
    "--cov=tests",
    "--strict-markers",
]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode="auto"
asyncio_default_fixture_loop_scope="function"
markers = [
	"duration(seconds): expected runtime; longer tests run first.",
	"fast: auto-applied when duration < 15 s; do not set manually.",
	"slow: auto-applied when duration >= 15 s; do not set manually.",
	"extras: requires optional extras (e.g. cplex) to be installed.",
]
log_cli = true
log_cli_level = "WARNING"

[tool.coverage.run]
branch = true
parallel = true
# uncomment to omit any file from the
# coverage. Regexps can be used
# to select all files from a folder
#omit = [
#  "template_python/to_omit.py",
#]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:", "pass"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/tutorials/retired"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # isort
    "N", # pep8-naming
    "D", # pydocstyle
    "UP", # pyupgrade
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "S", # flake8-bandit
    "BLE", # flake8-blind-except
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "COM", # flake8-commas
    "CPY", # flake8-copyright
    "C4", # flake8-comprehensions
    "C90", # mccabe
    "DTZ", # flake8-datetimez
    "EM", # flake8-errmsg
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "T10", # flake8-debugger
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TC", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "TD", # flake8-todos
    "FIX", # flake8-fixme
    "ERA", # eradicate
    "PGH", # pygrep-hooks
    "PL", # Pylint
    "TRY", # tryceratops
    "FLY", # flynt
    "PERF", # Perflint
    "FURB", # refurb
    "LOG", # flake8-logging
    "RUF", # ruff-specific rules
]
ignore = [
    "COM812", # missing-trailing-comma: conflicts with ruff format
    "FIX", # flake8-fixme: TODO comments are allowed
    "N803", # invalid-argument-name: math notation (Q, X, U, ...)
    "N806", # non-lowercase-variable-in-function: math notation (Q, X, dE, ...)
    "S101", # assert: redundant with bandit B101 (asserts carry `# nosec B101`)
    "SLF001", # private-member-access: cannot tell internal from external private members
    "TD003", # missing-todo-link: no issue-link convention
    "TRY003", # raise-vanilla-args: no custom exception class per message
]
isort = { required-imports = ["from __future__ import annotations"] }
mccabe = { max-complexity = 10 }
flake8-quotes = { docstring-quotes = "double" }
pydocstyle = { convention = "google" }
flake8-unused-arguments = { ignore-variadic-names = true }
flake8-copyright = { notice-rgx = "Copyright \\(c\\) Pasqal, 2026", min-file-size = 1 }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "T201", "PLR2004"]
"docs/**" = ["T201"]
"*.ipynb" = ["CPY001"]

[tool.bandit]
exclude_dirs = ["tests", "docs", "examples"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["qoolqit.*"]
follow_untyped_imports = true

[tool.deptry]
extend_exclude = ["docs/tutorials/retired"]

[tool.deptry.package_module_name_map]
pulser = ["pulser", "pulser_simulation"]
