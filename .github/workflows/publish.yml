name: Publish

on:
    release:
        types:
            [published]

permissions:
    contents: read

concurrency:
  group: fast-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
    publish_pypi:
        name: Publish package to PyPI
        runs-on: ubuntu-latest
        permissions:
            # IMPORTANT: this permission is mandatory for trusted publishing
            id-token: write
        steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            ref: ${{ github.ref }}
        - name: Install uv
          uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
          with:
            version: 0.13.5
            python-version: "3.14"
        - name: Build and publish package
          run: |
            uv build
        - name: Publish to PyPI
          uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        - name: Confirm deployment
          timeout-minutes: 5
          run: |
            VERSION=${GITHUB_REF#refs/tags/v}
            until uvx pip download qubo-solver==$VERSION
            do
                echo "Failed to download from PyPI, will wait for upload and retry."
                sleep 1
            done

    public_docs:
        name: Publish docs to github pages
        runs-on: ubuntu-latest
        steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Install uv
          uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
          with:
            version: 0.13.5
            python-version: '3.14'
        - name: Deploy docs
          run: |
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git fetch origin gh-pages
            uv run --group doc --no-default-groups mike deploy --push --update-aliases ${{ github.ref_name }} latest
        permissions:
            contents: write # TODO: wide permissions needed for deployment with mike

    betterleaks:
        name: Secret Detection
        needs: [public_docs]
        permissions:
            contents: read
            security-events: write
        uses: pasqal-io/qubo-solver/.github/workflows/betterleaks.yml@main
