name: Tests

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
      - 'release/v*'
  workflow_dispatch: {}

permissions:
    contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    name: Compute Python version matrix
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')) && '["3.10"]' || '["3.10", "3.11", "3.12"]' }}
    steps:
      - run: echo "Computed matrix"

  unit_tests:
    name: Unit testing
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.setup.outputs.python-versions) }}
    steps:
        - name: Checkout main code and submodules
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
          with:
            python-version: ${{ matrix.python-version }}
        - name: Install hatch
          run: |
            pip install --upgrade pip
            pip install hatch "virtualenv<21"
        - name: Perform unit tests
          run: |
            hatch -v run test
        - name: Upload coverage reports to Codecov
          uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            slug: pasqal-io/qubo-solver

  unit_tests_windows:
    name: Unit testing Windows
    needs: setup
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.setup.outputs.python-versions) }}
    steps:
        - name: Checkout main code and submodules
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
          with:
            python-version: ${{ matrix.python-version }}
        - name: Install hatch
          run: |
            pip install --upgrade pip
            pip install hatch "virtualenv<21"
        - name: Perform unit tests
          run: |
            hatch -v run test
        - name: Upload coverage reports to Codecov
          uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            slug: pasqal-io/qubo-solver

  unit_tests_precision_and_runtime_checks:
    name: Unit testing (single/double precision, runtime checks)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        use-double-precision: [0, 1]
    steps:
        - name: Checkout main code and submodules
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
          with:
            python-version: ${{ matrix.python-version }}
        - name: Install uv
          uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        - name: Perform unit tests
          env:
            USE_DOUBLE_PRECISION: ${{ matrix.use-double-precision }}
            QUBO_SOLVER_RUNTIME_CHECKS: 1
          run: |
            uv run --all-extras pytest

  test_notebook:
    name: Run the Jupyter notebook tutorial (Unix)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout mis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Hatch
        run: |
          pip install hatch "virtualenv<21"
      - name: Run notebooks
        run: |
          hatch  -v run test-notebooks

  test_docs:
    name: Documentation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
        - name: Checkout main code and submodules
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
          with:
            python-version: ${{ matrix.python-version }}
        - name: Install hatch
          run: |
            pip install --upgrade pip
            pip install hatch "virtualenv<21"
        - name: Install main dependencies
          run: |
            hatch -v -e docs
        - name: Test docs
          run: |
            hatch run docs:build
