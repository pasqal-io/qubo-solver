name: Tests

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
      - 'release/v*'
  workflow_dispatch: {}

permissions:
    contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    name: Compute test matrix
    runs-on: ubuntu-latest
    outputs:
      is-regular-pr: ${{ steps.compute.outputs.is-regular-pr }}
      os: ${{ steps.compute.outputs.is-regular-pr == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]' }}
      python-versions: ${{ steps.compute.outputs.is-regular-pr == 'true' && '["3.14"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]' }}
    steps:
      - id: compute
        run: echo "is-regular-pr=${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') }}" >> "$GITHUB_OUTPUT"

  unit_tests:
    name: Unit testing
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.os) }}
        python-version: ${{ fromJSON(needs.setup.outputs.python-versions) }}
    steps:
        - name: Checkout main code and submodules
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Install uv
          uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
          with:
            version: 0.11.30
            python-version: ${{ matrix.python-version }}
        - name: Perform unit tests
          run: |
            uv run --extra extras pytest
        - name: Upload coverage reports to Codecov
          uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            slug: pasqal-io/qubo-solver

  unit_tests_no_extras:
    name: Unit testing (without extras)
    needs: setup
    if: needs.setup.outputs.is-regular-pr != 'true'
    runs-on: ubuntu-latest
    steps:
        - name: Checkout main code and submodules
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Install uv
          uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
          with:
            version: 0.11.30
            python-version: "3.14"
        - name: Perform unit tests
          env:
            QUBOSOLVER_WITHOUT_EXTRAS: "1"
          run: |
            uv run pytest

  unit_tests_precision_and_runtime_checks:
    name: Unit testing (single/double precision, runtime checks)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
        use-double-precision: [0, 1]
    steps:
        - name: Checkout main code and submodules
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
          with:
            python-version: ${{ matrix.python-version }}
        - name: Install uv
          uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
          with:
            version: 0.11.30
        - name: Perform unit tests
          env:
            USE_DOUBLE_PRECISION: ${{ matrix.use-double-precision }}
            QUBO_SOLVER_RUNTIME_CHECKS: 1
          run: |
            uv run --extra extras pytest -W error
