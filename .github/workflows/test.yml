name: Tests

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'release/v*'
  workflow_dispatch: {}

permissions:
    contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    name: Compute test matrix
    # Skip draft PRs. Jobs that need `setup` are skipped too.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      is-regular-pr: ${{ steps.compute.outputs.is-regular-pr }}
      os: ${{ steps.compute.outputs.is-regular-pr == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]' }}
      python-versions: ${{ steps.compute.outputs.is-regular-pr == 'true' && '["3.14"]' || '["3.11", "3.12", "3.13", "3.14"]' }}
    steps:
      - id: compute
        run: echo "is-regular-pr=${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') }}" >> "$GITHUB_OUTPUT"

  unit_tests:
    name: Unit testing
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.os) }}
        python-version: ${{ fromJSON(needs.setup.outputs.python-versions) }}
    steps:
        - name: Checkout main code and submodules
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
        - name: Install uv
          uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
          with:
            version: 0.13.6
            python-version: ${{ matrix.python-version }}
            enable-cache: false
        - name: Perform unit tests
          # Coverage (100% required, see `[tool.coverage.report]`) is measured on one cell only,
          # matching the local command in CONTRIBUTING.md.
          run: |
            uv run --extra extras --group cpu pytest ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && '--cov --cov-report=term-missing --cov-report=xml' || '' }}
        - name: Upload coverage reports to Codecov
          if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' }}
          uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            slug: pasqal-io/qubo-solver

  unit_tests_no_extras:
    name: Unit testing (without extras)
    needs: setup
    if: needs.setup.outputs.is-regular-pr != 'true'
    runs-on: ubuntu-latest
    steps:
        - name: Checkout main code and submodules
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
        - name: Install uv
          uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
          with:
            version: 0.13.6
            python-version: "3.14"
            enable-cache: false
        - name: Perform unit tests
          env:
            QUBOSOLVER_WITHOUT_EXTRAS: "1"
          run: |
            uv run pytest

  unit_tests_precision_and_runtime_checks:
    name: Unit testing (single/double precision, runtime checks)
    # Same condition as `setup`: this job does not need it.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
        use-double-precision: [0, 1]
    steps:
        - name: Checkout main code and submodules
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
        - name: Install uv
          uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
          with:
            version: 0.13.6
            python-version: ${{ matrix.python-version }}
            enable-cache: false
        - name: Perform unit tests
          env:
            USE_DOUBLE_PRECISION: ${{ matrix.use-double-precision }}
            QUBO_SOLVER_RUNTIME_CHECKS: 1
          run: |
            uv run --extra extras --group cpu pytest -W error
