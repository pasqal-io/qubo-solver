name: Linting

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
    contents: read

env:
  UV_LOCKED: "1"  # uv run/sync fail if uv.lock is out of sync with pyproject.toml

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
        - name: Checkout main code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
        - name: Install uv
          uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
          with:
            version: 0.13.6
            python-version: ${{ matrix.python-version }}
            enable-cache: true
        - name: Check files and lint
          run: |
            uv run --no-default-groups --group dev --group cpu prek run --all-files
