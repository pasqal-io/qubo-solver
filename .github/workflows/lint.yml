name: Linting

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
    contents: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
        - name: Checkout main code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Install uv
          uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
          with:
            version: 0.12.23
            python-version: ${{ matrix.python-version }}
            enable-cache: true
        - name: Check files and lint
          run: |
            uv run --no-default-groups --group dev prek run --all-files
