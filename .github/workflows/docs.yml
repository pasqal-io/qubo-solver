name: Docs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.16
          python-version: "3.14"

      - name: Build documentation
        run: |
          uv run --group doc --no-default-groups properdocs build --clean --strict

  publish-dev-docs:
    name: Publish development docs to GitHub Pages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # TODO: wide permissions needed for deployment with mike
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.16
          python-version: "3.14"
      - name: Deploy docs
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin gh-pages
          uv run --group doc --no-default-groups mike deploy --push --update-aliases main development
