name: Docs

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.30
          python-version: "3.14"

      - name: Build documentation
        run: |
          uv run --group doc --no-default-groups properdocs build --clean --strict

      - name: Upload built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-site
          path: ./site/
          retention-days: 1

  deploy:
    name: Deploy preview
    needs: [build]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the base commit, never the PR head
        # Intentionally checks out base.sha (trusted) instead of the PR head,
        # so untrusted PR code/workflow-file changes never run with these write perms.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Download built site
        if: github.event.action != 'closed'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-preview-site
          path: ./site/

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./site/
          preview-branch: gh-pages
          qr-code: false
          wait-for-pages-deployment: true

  portal-preview:
    name: Deploy doc-portal preview
    needs: [deploy]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # PR number is a numeric/trusted field from the event payload, so string-
      # interpolating it here and below (BUILD_CONFIG/ASTRO_BASE, docker run args) is
      # safe from injection — unlike e.g. head.ref or PR title, which must never be
      # interpolated into a shell `run:` this way (classic script-injection vector).
      PORTAL_PREVIEW_PATH: portal-preview/pr-${{ github.event.pull_request.number }}
      DOC_PORTAL_IMAGE: europe-west9-docker.pkg.dev/pasqal-artifact/frontend/doc-portal:source-runtime
    steps:
      - name: Checkout the base commit, never the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Login to Artifact Registry
        if: github.event.action != 'closed'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: europe-west9-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_ARTIFACT_REGISTRY_SA }}

      - name: Pull the doc portal image
        if: github.event.action != 'closed'
        run: docker pull "$DOC_PORTAL_IMAGE"

      - name: Build the portal preview
        if: github.event.action != 'closed'
        run: |
          mkdir -p portal-dist
          docker run --rm \
            --user 0:0 \
            --volume "$PWD/portal-dist:/out" \
            --env BUILD_CONFIG='{"qubo":"https://pasqal-io.github.io/qubo-solver/pr-preview/pr-${{ github.event.pull_request.number }}/"}' \
            --env ASTRO_BASE="/qubo-solver/${PORTAL_PREVIEW_PATH}/" \
            --entrypoint sh \
            "$DOC_PORTAL_IMAGE" \
            -c 'cd /app && pnpm --filter @pasqal/doc-portal run build:selected && cp -r /app/packages/doc-portal/dist/. /out/'

      # Keep only the qubo pages and the shared assets they load; the other products are ~130 MB per preview.
      # Temporary until doc-portal can build qubo alone, see pasqal-io/qoolqit#488.
      - name: Trim the portal preview to qubo
        if: github.event.action != 'closed'
        run: |
          mkdir -p portal-trimmed/applicationsolvingtools
          cd portal-dist
          cp -r applicationsolvingtools/qubo ../portal-trimmed/applicationsolvingtools/
          cp -r _astro assets pagefind favicon.* ../portal-trimmed/

      - name: Deploy portal preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./portal-trimmed/
          preview-branch: gh-pages
          umbrella-dir: portal-preview
          qr-code: false
          comment: false
          wait-for-pages-deployment: true

      - name: Comment the preview link on the PR
        # `head.sha` here is fine — it's only interpolated into a comment body
        # string, not executed as a shell command, so it's not an injection vector
        # (unlike the docker run: block above, which is why numeric-only fields are
        # used there).
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: doc-portal-preview
          message: |
            Doc portal preview: https://pasqal-io.github.io/qubo-solver/${{ env.PORTAL_PREVIEW_PATH }}/applicationsolvingtools/qubo/

            Built from ${{ github.event.pull_request.head.sha }}.

      - name: Remove the preview comment
        if: github.event.action == 'closed'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: doc-portal-preview
          delete: true

  publish-dev-docs:
    name: Publish development docs to GitHub Pages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # TODO: wide permissions needed for deployment with mike
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.30
          python-version: "3.14"
      - name: Deploy docs
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin gh-pages
          uv run --group doc --no-default-groups mike deploy --push --update-aliases main development

  betterleaks-gh-pages:
    name: Secret Detection (gh-pages)
    needs: [portal-preview, publish-dev-docs]
    if: always()
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/betterleaks.yml
    with:
      scan_gh_pages: true
