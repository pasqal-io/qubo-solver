name: Security & Quality

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
      - 'release/v*'
  schedule:
    - cron: "0 6 * * *"  # Daily, to catch new CVEs without a push
  workflow_dispatch: {}

permissions:
  contents: read  # Minimal permissions — read-only access to repo contents

jobs:

  bandit:
    # SAST (Static Application Security Testing) — scans Python source code for
    # common security issues (hardcoded secrets, unsafe calls, injection risks, etc.)
    # Results are uploaded to the GitHub Security tab as SARIF annotations.
    name: SAST - Bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          python-version: "3.14"
      - name: Run Bandit
        env:
          # renovate: datasource=pypi depName=bandit versioning=pep440
          BANDIT_VERSION: 1.9.4
        run: uvx --from "bandit[toml,sarif]==${BANDIT_VERSION}" bandit -r qubosolver/ -c pyproject.toml -f sarif -o bandit-results.sarif || true  #TODO: remove 'true' once all warnings are fixed
      - name: Upload Bandit SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: bandit-results.sarif

  trivy:
    # SCA (Software Composition Analysis) — scans dependencies for known CVEs and license info.
    # SBOM (Software Bill of Materials) — generates a full inventory of all dependencies
    # in CycloneDX format, uploaded as a build artifact and submitted to the GitHub Dependency Graph.
    # Vulnerability results are uploaded to the GitHub Security tab as SARIF annotations.
    name: SCA + SBOM - Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write  # Required for SARIF upload to GitHub Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          python-version: "3.14"
          activate-environment: true  # Creates .venv and exports VIRTUAL_ENV for Trivy

      - name: Install dependencies
        run: uv sync -U

      - name: Generate requirements.txt
        run: |
          uv export --format requirements-txt --no-hashes -o requirements.txt
          rm uv.lock

      # Scan once, then convert the JSON report to every other format.
      # The license scanner is left out: it would gate on (and flood the SARIF with) license
      # classifications; the SBOM gets package licenses from the installed metadata anyway.
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          scanners: vuln,secret
          exit-code: "0"

      - name: Check vulnerabilities # Fails on main if vulnerabilities are found
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        with:
          skip-setup-trivy: true
          scan-type: convert
          scan-ref: trivy-results.json
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Convert to SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: convert
          scan-ref: trivy-results.json
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: convert
          scan-ref: trivy-results.json
          format: cyclonedx
          output: sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sbom
          path: sbom.cdx.json

      - name: Submit Dependency Snapshot to GitHub Dependency Graph
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: convert
          scan-ref: trivy-results.json
          format: github
          output: dependency-snapshot.json
          github-pat: ${{ secrets.GITHUB_TOKEN }}

  licenses:
    # License check — fails if a dependency shipped to users (runtime + extras, not the
    # dependency groups) is GPL-family (GPL/LGPL/AGPL) or declares no license.
    name: Licenses - pip-licenses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          python-version: "3.14"
      - name: Install runtime dependencies and extras only
        run: uv sync --no-default-groups --all-extras
      - name: Reject GPL-family and undeclared licenses  # Configured in [tool.pip-licenses]
        env:
          # renovate: datasource=pypi depName=pip-licenses versioning=pep440
          PIP_LICENSES_VERSION: 5.5.5
        run: uvx "pip-licenses==${PIP_LICENSES_VERSION}" --python .venv/bin/python

  zizmor:
    # GitHub Actions static analysis — scans workflows for security issues (template injection,
    # credential persistence, unpinned or known-vulnerable actions, impostor commits, etc.)
    # Results are uploaded to the GitHub Security tab as SARIF annotations.
    name: Actions - zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
