name: Security & Quality

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
      - 'release/v*'
  workflow_dispatch: {}

permissions:
  contents: read  # Minimal permissions — read-only access to repo contents

jobs:

  bandit:
    # SAST (Static Application Security Testing) — scans Python source code for
    # common security issues (hardcoded secrets, unsafe calls, injection risks, etc.)
    # Results are uploaded to the GitHub Security tab as SARIF annotations.
    name: SAST - Bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install bandit[toml,sarif]
      - name: Run Bandit
        run: bandit -r qubosolver/ -c pyproject.toml -f sarif -o bandit-results.sarif || true  #TODO: remove 'true' once all warnings are fixed
      - name: Upload Bandit SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: bandit-results.sarif

  gitleaks:
    name: Secret Detection - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: sudo apt-get install -y gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --verbose

  trivy:
    # SCA (Software Composition Analysis) — scans dependencies for known CVEs and license info.
    # SBOM (Software Bill of Materials) — generates a full inventory of all dependencies
    # in CycloneDX format, uploaded as a build artifact and submitted to the GitHub Dependency Graph.
    # Vulnerability results are uploaded to the GitHub Security tab as SARIF annotations.
    name: SCA + SBOM - Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write  # Required for SARIF upload to GitHub Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.30

      - name: Install dependencies
        run: uv sync -p 3.12 -U

      - name: Generate requirements.txt
        run: |
          uv export --format requirements-txt --no-hashes -o requirements.txt
          rm uv.lock

      - name: Run Trivy scan # Detect vulnerabilities and fails if vulnerabilities are found
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: ${{ github.ref }} != 'refs/heads/main'
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Run Trivy scan for upload # Never fails so the SARIF file is always available
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          scanners: vuln,license
        env:
          VIRTUAL_ENV: ${{ env.VIRTUAL_ENV }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sbom
          path: sbom.cdx.json

      - name: Submit Dependency Snapshot to GitHub Dependency Graph
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          format: github
          output: dependency-snapshot.json
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          scanners: vuln,license
        env:
          VIRTUAL_ENV: ${{ env.VIRTUAL_ENV }}
