name: Security & Quality

on:
  workflow_dispatch:  # Manual trigger only — run via "Run workflow" button in GitHub Actions UI
  pull_request: {}

permissions:
  contents: read  # Minimal permissions — read-only access to repo contents

jobs:

  bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit[toml,sarif]
      - name: Run Bandit
        run: bandit -r qubosolver/ -c pyproject.toml -f sarif -o bandit-results.sarif
      - name: Upload Bandit SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-results.sarif

  gitleaks:
    name: Secret Detection - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: apt-get install -y gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --verbose

  pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit .

  trivy:
    name: SCA + SBOM - Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload to GitHub Security tab
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH  # Blocks on HIGH and CRITICAL only
      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()  # Upload even if scan failed, to still post the report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: "!env.ACT"
        with:
          name: sbom
          path: sbom.cdx.json

  pyright:
    name: Type checking - Pyright
    runs-on: ubuntu-latest
    continue-on-error: true  # Warning only — does not block merge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev]
      - uses: jakebailey/pyright-action@v2
        with:
          pylance-version: latest-release
