name: Secret Detection

on:
  push:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read  # Minimal permissions — read-only access to repo contents

jobs:

  betterleaks:
    name: Secret Detection - Betterleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for git scan mode
          persist-credentials: false
      - name: Read the betterleaks version from the pre-commit hook
        id: betterleaks-version
        # The `# frozen:` comment of the hook (maintained by Renovate) is the single source of truth.
        # yq (mikefarah, preinstalled on GitHub runners) parses the YAML, so formatting changes don't break it.
        run: |
          version=$(yq '.repos[] | select(.repo == "https://github.com/betterleaks/betterleaks") | .rev | line_comment | sub("^frozen: ", "")' .pre-commit-config.yaml)
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Run betterleaks
        uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515 # v0.1.0
        with:
          version: ${{ steps.betterleaks-version.outputs.version }}
          config: .betterleaks.toml  # Since v1.10.0, betterleaks no longer auto-loads it
          scan-mode: git
          report-format: sarif
          report-path: betterleaks-report.sarif
          github-token: ${{ github.token }}
      - name: Upload Betterleaks SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: betterleaks-report.sarif
