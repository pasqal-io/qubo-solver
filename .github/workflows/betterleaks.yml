name: Secret Detection

on:
  push:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read  # Minimal permissions — read-only access to repo contents

jobs:

  betterleaks:
    name: Secret Detection - Betterleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for git scan mode
      - name: Run betterleaks
        uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515 # v0.1.0
        with:
          version: v1.8.1
          scan-mode: git
          report-format: sarif
          report-path: betterleaks-report.sarif
          github-token: ${{ github.token }}
      - name: Upload Betterleaks SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: betterleaks-report.sarif
