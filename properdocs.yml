theme:
  name: material
  logo: extras/assets/logo/qubosolver_symbol_white.svg
  favicon: extras/assets/logo/qubosolver_symbol_darkgreen.svg
  custom_dir: docs/extras/overrides/
  features:
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.suggest

  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: custom
    toggle:
      icon: material/weather-night
      name: Switch to light mode

markdown_extensions:
- admonition  # for notes
- pymdownx.details  # for collapsible sections
- footnotes
- pymdownx.arithmatex: # for mathjax
    generic: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.tabbed:
      alternate_style: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences
- mdx_math:
    enable_dollar_delimiter: True #for use of inline $..$

plugins:
- search
- macros
- section-index
- markdown-exec
- autorefs
- mkdocs-jupyter:
    include: ["*.ipynb"]
    include_requirejs: true
    custom_mathjax_url: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/latest.js?config=TeX-AMS_CHTML-full,Safe"
- mkdocstrings:
    handlers:
      python:
        paths: [qubosolver]
        inventories:
        - url: https://pasqal-io.github.io/qoolqit/latest/objects.inv
          base_url: https://docs.pasqal.com/qoolqit/
        - url: https://pytorch.org/docs/stable/objects.inv
        - url: https://pandas.pydata.org/docs/objects.inv
        - url: https://docs.python.org/3/objects.inv
        options:
          docstring_options:
            ignore_init_summary: true
          docstring_section_style: list
          filters: public
          heading_level: 2
          inherited_members: true
          merge_init_into_class: true
          parameter_headings: false
          type_parameter_headings: true
          preload_modules: [qubosolver]
          relative_crossrefs: true
          scoped_crossrefs: true
          show_bases: false
          show_inheritance_diagram: false
          show_root_heading: true
          show_root_full_path: true
          show_signature_annotations: true
          show_signature_type_parameters: true
          show_source: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          show_overloads: false
          signature_crossrefs: true
          summary: true
          unwrap_annotated: true
          separate_signature: true
          annotations_path: source
          line_length: 80


watch:
  - qubosolver

extra:
 version:
   provider: mike

# To get nice tabs
extra_css:
- extras/css/mkdocstrings.css
- extras/css/home.css
- extras/css/colors.css

# For mathjax
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS_HTML
